[package]
name = "certval-verify"
version = "0.1.0"
# A sample to read and build from source, so its trust material is as current as the store crates it
# builds against; not published.
publish = false
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-verify"
description = "Validate a certificate with certval against a trust store the binary contains"

# Its own workspace root, so the crate builds the same whether it is cloned on its own or dropped
# next to others. A consumer starts from a checkout of this directory and nothing else.
[workspace]

[dependencies]
certval = { version = "0.2.0-rc.1", features = ["remote", "rsa"] }
certval_stores_core = "0.1.0-rc.1"
certval_stores_fpki = "1.0.0-rc.1"
certval_stores_webpki_root_certs = "1.0.0-rc.1"

clap = { version = "4", features = ["derive"] }
der = "0.8"
env_logger = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
x509-cert = "0.3"
